name: Bug report
description: Report a repeatable firmware or hardware behavior problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat
      description: List the steps needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Pico board, O4 hardware, receiver, GPS, sensors, battery setup.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Logs, OSD text, scope readings, photos, or test notes.
    validations:
      required: false
